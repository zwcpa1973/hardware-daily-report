name: Rebuild charts + README

# 云端只做"重算"：从 data/prices.csv 重建走势图/README/首页并发布 Pages。
# 京东/淘宝价格抓取因登录墙在本地计划任务完成（run_daily.bat）。
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CJK fonts + deps
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt

      - name: Rebuild report from CSV
        run: python scripts/run_daily.py --no-scrape --no-email --no-push

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Rebuild charts ${GITHUB_SHA::7}" && git push)
